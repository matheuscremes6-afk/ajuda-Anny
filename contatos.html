<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080C">
<title>Contatos</title>
<style>
:root{--bg:#08080C;--card:#101016;--line:#1e1e29;--tx:#ECECF3;--mut:#8b8b9c;--blue:#A9C7FF;--pink:#F4B6D2;--green:#B5E8C3;--lilac:#CDB8F5;--yellow:#F7E3A1;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:rgba(8,8,12,.94);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0px) + 12px) 0 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
#count{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px;color:var(--mut)}
.search:focus-within{border-color:var(--blue)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px}
.search button{background:none;border:0;color:var(--mut);padding:4px;display:none;cursor:pointer}
.ibtn{position:relative;width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.ibtn b{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--lilac);color:#0b0b10;font-size:11px;display:none;place-items:center;padding:0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip small{opacity:.7;margin-left:4px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#0b0b10}
.chip.t.on{background:var(--lilac);border-color:var(--lilac)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-left:auto;flex:none}
.seg button{border:0;background:none;color:var(--mut);font:inherit;font-size:12.5px;padding:6px 10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--line);color:var(--tx)}
.sec{margin:16px 2px 6px;color:var(--yellow);font-weight:650;font-size:13px;letter-spacing:.08em;scroll-margin-top:150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0;padding:11px 12px;cursor:pointer}
.card.open{border-color:#2d2d3d}
.row{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#0b0b10;font-weight:700;font-size:14px;flex:none}
.nm{min-width:0;flex:1}
.nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm span{color:var(--mut);font-size:13px}
.det{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.open .det{display:block}
.meta{color:var(--mut);font-size:13px;margin-bottom:10px;word-break:break-word}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tg i{font-style:normal;font-size:12px;padding:3px 9px;border-radius:999px;background:#17171f;color:var(--lilac);border:1px solid var(--line)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.acts a,.acts button{display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:12px;border:1px solid var(--line);background:#14141c;color:var(--tx);font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.acts .wa{background:var(--green);color:#0b0b10;border-color:var(--green)}
.acts .ph{background:var(--blue);color:#0b0b10;border-color:var(--blue)}
#empty{display:none;text-align:center;color:var(--mut);padding:60px 10px}
#more{height:1px}
#rail{position:fixed;right:2px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;z-index:15;max-height:72vh;justify-content:space-between}
#rail button{background:none;border:0;color:var(--mut);font-size:10.5px;line-height:1;padding:2.5px 6px;cursor:pointer}
#rail button:active{color:var(--yellow)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:var(--green);color:#0b0b10;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:40;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#0e0e14;border:1px solid var(--line);border-radius:22px 22px 0 0;max-width:720px;margin:0 auto;max-height:82vh;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0)}
.show{display:block!important}#sheet.show{display:flex!important}
.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.sh b{font-size:17px}.sh button{background:none;border:0;color:var(--mut);cursor:pointer;padding:4px}
.sb{overflow-y:auto;padding:4px 18px 10px}
.sb h3{margin:14px 0 8px;font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.wrapc{display:flex;flex-wrap:wrap;gap:8px}
.sf{display:flex;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.sf button{flex:1;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.sf .go{background:var(--lilac);border-color:var(--lilac);color:#0b0b10;font-weight:650;flex:2}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1>Contatos</h1><span id="count"></span></div>
  <div class="bar">
    <label class="search"><span id="i-s"></span><input id="q" type="search" placeholder="Buscar nome, telefone, e-mail…" autocomplete="off" enterkeyhint="search"><button id="qx" aria-label="Limpar"></button></label>
    <button class="ibtn" id="fb" aria-label="Filtros"><span id="i-f"></span><b id="fn"></b></button>
  </div>
  <div class="chips" id="types"></div>
  <div class="bar" style="margin-top:8px"><div class="seg"><button data-s="az" class="on">A–Z</button><button data-s="rec">Recentes</button></div></div>
</div></header>
<main class="wrap"><div id="list"></div><div id="empty">Nenhum contato encontrado.</div><div id="more"></div></main>
<div id="rail"></div>
<div id="toast"></div>
<div id="ov"></div>
<div id="sheet"><div class="sh"><b>Filtros</b><button id="sx" aria-label="Fechar"></button></div>
<div class="sb"><h3>Etiquetas</h3><div class="wrapc" id="tags"></div><h3>Outros</h3><div class="wrapc"><button class="chip" id="mail">Só com e-mail</button></div></div>
<div class="sf"><button id="clr">Limpar</button><button class="go" id="go"></button></div></div>
